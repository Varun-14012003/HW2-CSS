<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 14</title>
    <style>
        body {
            margin: 0;
            padding-top: 70px;
        }
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background-color: darkslateblue;
            color: white;
            text-align: center;
            line-height: 70px;
            z-index: 10;
        }
        .section1 {
            position: relative;
            height: 300px;
            background-color: lightyellow;
            padding: 20px;
        }
        .inner-box {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 150px;
            height: 100px;
            background-color: orange;
            text-align: center;
        }
        .section2 {
            position: sticky;
            top: 70px;
            height: 100px;
            background-color: lightgreen;
            padding: 20px;
        }
        .section3 {
            height: 800px;
            background-color: lightblue;
            padding: 20px;
        }
        footer {
            position: static;
            background-color: darkslategray;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <header>
        <h2 style="margin: 0; line-height: 70px;">Fixed Header</h2>
    </header>

    <main>
        <section class="section1">
            <h3>Section 1 (relative)</h3>
            <div class="inner-box">Absolute inner box</div>
        </section>

        <section class="section2">
            <h3>Section 2 (sticky)</h3>
        </section>

        <section class="section3">
            <h3>Section 3</h3>
        </section>
    </main>

    <footer>
        Footer (static)
    </footer>
</body>
</html>
