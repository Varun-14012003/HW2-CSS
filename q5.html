<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 5</title>
    <style>
        .box1 {
            background-color: lightyellow;
            padding: 15px;
            margin: 15px;
        }
        .box2 {
            background-color: lightblue;
            padding: 15px;
            margin: 15px;
        }
        .text1 {
            background-color: lightgreen;
            font-size: 16px;
        }
        .text2 {
            background-color: lightpink;
            font-size: 20px;
        }
        .highlight {
            background-color: orange;
            font-size: 30px;
        }
    </style>
</head>
<body>
    <div class="box1">
        <p class="text1">This is the first paragraph inside the first div.</p>
    </div>

    <div class="box2">
        <p class="text2">This is the second paragraph with a <span class="highlight">highlighted span</span> inside it.</p>
    </div>
</body>
</html>
